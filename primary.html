<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التعليم الابتدائي - أكاديمية مشكاة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<script>try{if(localStorage.getItem('mishkat_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<style>
:root{--ink:#1f2a44;--muted:#5b6b86;--card:#fff;--blue:#1d8cf8;--bgfrom:#fff7cc;--bgmid:#e6f6ff;--bgto:#ffeef6;--shadow:rgba(31,42,68,.16);color-scheme:light}
:root[data-theme="dark"]{--ink:#f2f5f8;--muted:#9aa7b6;--card:#16212d;--blue:#4aa8ff;--bgfrom:#0f2438;--bgmid:#0d141c;--bgto:#15131f;--shadow:rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{font-family:'Tajawal',system-ui,sans-serif;min-height:100vh;padding:34px 5% 44px;background:linear-gradient(135deg,var(--bgfrom),var(--bgmid) 55%,var(--bgto));color:var(--ink);text-align:center}
.wrap{max-width:620px;margin:0 auto}
.logo{font-weight:800;font-size:18px;margin-bottom:14px}
.hello{display:inline-block;background:#fff;color:#1f2a44;border-radius:999px;padding:12px 26px;border:3px solid #ffb703;box-shadow:0 10px 26px var(--shadow);font-weight:800;font-size:clamp(18px,4vw,26px);direction:ltr;letter-spacing:.3px}
h1{font-size:clamp(24px,5vw,34px);font-weight:800;margin:22px 0 4px}
.sub{color:var(--muted);font-size:17px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:24px auto 0}
.grid>.kc:last-child:nth-child(odd){grid-column:1/-1;justify-self:center;width:calc(50% - 8px)}
.kc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:150px;padding:18px 10px;border-radius:26px;background:var(--c,#ffd54a);border:4px solid #fff;box-shadow:0 10px 0 rgba(31,42,68,.12),0 16px 30px var(--shadow);color:#1f2a44;font-family:inherit;font-weight:800;cursor:pointer;text-decoration:none;transition:transform .2s}
.kc:hover,.kc:focus-visible{transform:translateY(-5px) rotate(-1deg)}
.kc:active{transform:translateY(2px)}
.em{font-size:54px;line-height:1.1}
.nm{font-size:20px;line-height:1.3}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:560px;margin:18px auto 0}
.kbtn{display:inline-flex;align-items:center;justify-content:center;width:100%;padding:12px 22px;border-radius:999px;background:var(--card);border:2px solid var(--blue);color:var(--blue);font:inherit;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 8px 18px var(--shadow)}
.kbtn:hover,.kbtn:focus-visible{background:var(--blue);color:#fff}
.bar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:30px}
.back,.mode{display:inline-block;padding:8px 20px;border:1.5px solid var(--blue);border-radius:999px;background:var(--card);color:var(--blue);font:inherit;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none}
.back:hover,.mode:hover{background:var(--blue);color:#fff}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);max-width:90vw;padding:12px 22px;border-radius:999px;background:var(--card);color:var(--ink);border:1.5px solid var(--blue);box-shadow:0 14px 34px var(--shadow);font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:30;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:420px){.em{font-size:44px}.nm{font-size:17px}.kc{min-height:132px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">أكاديمية مشكاة</div>
  <div class="hello" id="hello">مرحبا بك في منصة MISHKAT</div>
  <h1 id="ttl">التعليم الابتدائي</h1>
  <p class="sub" id="sub">اختر السنة الدراسية</p>
  <div class="grid" id="grid"></div>
  <div class="row2" id="extra"></div>
  <div class="bar">
    <a class="back" id="backb" href="index.html">← العودة للرئيسية</a>
    <button class="mode" id="mode" type="button">🌙 الوضع الليلي</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
var $=function(i){return document.getElementById(i);};
var root=document.documentElement, modeBtn=$('mode');
function paint(){modeBtn.textContent=root.getAttribute('data-theme')==='dark'?'☀️ الوضع النهاري':'🌙 الوضع الليلي';}
paint();
modeBtn.onclick=function(){
  var d=root.getAttribute('data-theme')==='dark';
  if(d){root.removeAttribute('data-theme');}else{root.setAttribute('data-theme','dark');}
  try{localStorage.setItem('mishkat_theme',d?'light':'dark');}catch(e){}
  paint();
};

var toast=$('toast'), tm;
function say(m){toast.textContent=m;toast.classList.add('on');clearTimeout(tm);tm=setTimeout(function(){toast.classList.remove('on');},2600);}

var YEARS=[
  {y:1,n:'1 ابتدائي',e:'🌱',c:'#ffd54a'},
  {y:2,n:'2 ابتدائي',e:'🌿',c:'#8ee6a0'},
  {y:3,n:'3 ابتدائي',e:'🌳',c:'#7fd3ff'},
  {y:4,n:'4 ابتدائي',e:'🌻',c:'#ffa6c9'},
  {y:5,n:'5 ابتدائي',e:'🌟',c:'#ffb36b'}
];
var SUBS=[
  {k:'math',n:'الرياضيات',e:'🔢',c:'#ffd54a'},
  {k:'arabic',n:'اللغة العربية',e:'📝',c:'#8ee6a0'},
  {k:'science',n:'التربية العلمية',e:'🔬',c:'#7fd3ff'},
  {k:'islam',n:'التربية الإسلامية',e:'🕌',c:'#ffa6c9'}
];
var EXTRA=[
  {k:'history',n:'التاريخ والجغرافيا',e:'🌍',c:'#b6f0e6'},
  {k:'civic',n:'التربية المدنية',e:'🤝',c:'#ffe08a'},
  {k:'french',n:'الفرنسية',e:'🇫🇷',c:'#bfe3ff'},
  {k:'english',n:'الإنجليزية',e:'🇬🇧',c:'#ffc9b0'}
];

var P=new URLSearchParams(location.search);
var Y=parseInt(P.get('y'),10)||0, S=P.get('s')||'', K=P.get('k')||'';
var yr=YEARS.filter(function(x){return x.y===Y;})[0]||null;
if(!yr) Y=0;
var pool=SUBS.concat(Y>=3?EXTRA:[]);
var sb=Y?(pool.filter(function(x){return x.k===S;})[0]||null):null;
if(!sb) S='';
if(!Y){S='';K='';}
if(!S){K='';}

function url(o){
  var p=[];
  if(o.y) p.push('y='+o.y);
  if(o.s) p.push('s='+o.s);
  if(o.k) p.push('k='+o.k);
  return 'primary.html'+(p.length?'?'+p.join('&'):'');
}

var title, subt, back, hello;
if(!Y){
  title='التعليم الابتدائي'; subt='اختر السنة الدراسية'; back='index.html'; hello='مرحبا بك في منصة MISHKAT';
}else if(!S){
  title=yr.n; subt='اختر المادة'; back='primary.html'; hello='مرحبا بكم في منصة MISHKAT';
}else if(!K){
  title=sb.n; subt=yr.n; back=url({y:Y}); hello='مرحبا بكم في منصة MISHKAT';
}else{
  title='كتب الأنشطة'; subt=sb.n+' • '+yr.n; back=url({y:Y,s:S}); hello='مرحبا بكم في منصة MISHKAT';
}
$('hello').textContent=hello;
$('ttl').textContent=title;
$('sub').textContent=subt;
$('backb').href=back;
document.title=title+' - أكاديمية مشكاة';

function card(label,em,color,href,onclick){
  var el=document.createElement(href?'a':'button');
  el.className='kc';
  if(href){el.href=href;}else{el.type='button';el.onclick=onclick;}
  el.style.setProperty('--c',color);
  el.innerHTML='<span class="em">'+em+'</span><span class="nm">'+label+'</span>';
  return el;
}

var g=$('grid'), extra=$('extra');
if(!Y){
  YEARS.forEach(function(y){g.appendChild(card(y.n,y.e,y.c,url({y:y.y})));});
}else if(!S){
  pool.forEach(function(s){g.appendChild(card(s.n,s.e,s.c,url({y:Y,s:s.k})));});
}else if(!K){
  g.appendChild(card('كتب الأنشطة','📒','#ffd54a',url({y:Y,s:S,k:'act'})));
  g.appendChild(card('التمارين','✏️','#8ee6a0',null,function(){say('تمارين «'+sb.n+'» قيد الإعداد ✨');}));
  ['الدروس','المحفوظات'].forEach(function(t){
    var b=document.createElement('button');
    b.type='button';
    b.className='kbtn';
    b.textContent=t;
    b.onclick=function(){say('«'+t+'» لـ'+sb.n+' قيد الإعداد ✨');};
    extra.appendChild(b);
  });
}else{
  g.appendChild(card('أنشطة لغوية','🔤','#ffd54a',null,function(){say('الأنشطة اللغوية قيد الإعداد ✨');}));
  g.appendChild(card('أنشطة رياضية','➕','#8ee6a0',null,function(){say('الأنشطة الرياضية قيد الإعداد ✨');}));
}
</script>
</body>
</html>
