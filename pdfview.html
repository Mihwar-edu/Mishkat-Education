<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عرض الملف - أكاديمية مشكاة</title>
<link rel="icon" href="logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<script>try{if(localStorage.getItem('mishkat_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<style>
:root{--blue:#2f6bff;--ink:#101828;--muted:#667085;--card:#fff;--line:#eaeef3;--bgfrom:#e3f4ff;--bgmid:#f4fbff;--bgto:#fffbea;--shadow:rgba(10,132,255,.14);color-scheme:light}
:root[data-theme="dark"]{--ink:#f2f5f8;--muted:#9aa7b6;--card:#16212d;--line:#223041;--bgfrom:#0f2438;--bgmid:#0d141c;--bgto:#0d141c;--shadow:rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{font-family:'Tajawal',system-ui,sans-serif;min-height:100vh;padding:18px 4% 100px;background:linear-gradient(135deg,var(--bgfrom),var(--bgmid) 60%,var(--bgto));color:var(--ink);text-align:center}
.wrap{max-width:760px;margin:0 auto}
.top{margin-bottom:12px}
.lg{display:block;font-weight:800;font-size:15px;color:var(--muted)}
h1{font-size:clamp(20px,4.5vw,28px);font-weight:800;line-height:1.4;margin-top:2px}

/* إطار العرض */
.viewer{position:relative;height:min(74vh,900px);min-height:380px;background:#1f1f1f;border:3px solid #2f55d4;border-bottom:0;border-radius:14px 14px 0 0;overflow:hidden}
.pages{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:8px;-webkit-overflow-scrolling:touch}
.pg{position:relative;margin:0 auto 10px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.45)}
.pg canvas{display:block;position:absolute;inset:0}
.load{position:absolute;inset:0;z-index:3;display:grid;place-items:center;padding:20px;background:#1f1f1f;color:#fff;font-weight:700;font-size:16px;line-height:1.9}
.load a{color:#7fb0ff;font-weight:800}

/* عدّاد الصفحات */
.pill{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:4;display:flex;align-items:center;gap:10px;padding:8px 18px;border-radius:999px;background:rgba(10,10,12,.82);color:#fff;font-weight:700;font-size:15px;direction:rtl;white-space:nowrap}
.pill input{width:54px;height:30px;border:0;border-radius:6px;background:rgba(255,255,255,.14);color:#fff;font:inherit;font-size:15px;font-weight:800;text-align:center;direction:ltr;-moz-appearance:textfield}
.pill input::-webkit-outer-spin-button,.pill input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.pill .of{direction:ltr}

/* شريط التحميل */
.dl{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;background:#3a63e8;color:#fff;font-weight:800;font-size:18px;text-decoration:none;border-radius:0 0 14px 14px;box-shadow:0 10px 24px var(--shadow)}
.dl:hover,.dl:focus-visible{background:#2f55d4}
.dl svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* زر المشاركة العائم */
.share{position:fixed;left:16px;bottom:18px;z-index:20;width:56px;height:56px;border:0;border-radius:50%;background:#3a63e8;color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 24px rgba(47,85,212,.5)}
.share:hover,.share:focus-visible{background:#2f55d4}
.share svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.bar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px}
.back,.home,.mode{display:inline-block;padding:8px 20px;border:1.5px solid var(--blue);border-radius:999px;background:var(--card);color:var(--blue);font:inherit;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none}
.back:hover,.home:hover,.mode:hover{background:var(--blue);color:#fff}

.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);max-width:90vw;padding:12px 22px;border-radius:999px;background:var(--card);color:var(--ink);border:1.5px solid var(--blue);box-shadow:0 14px 34px var(--shadow);font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:30;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="lg">أكاديمية مشكاة</span>
    <h1 id="ttl">عرض الملف</h1>
  </div>

  <div class="viewer" id="viewer">
    <div class="pages" id="pages"></div>
    <div class="pill" id="pill" hidden>
      <span>الصفحة</span>
      <input id="pn" type="number" inputmode="numeric" min="1" value="1" aria-label="رقم الصفحة">
      <span class="of" id="of">/ 1</span>
    </div>
    <div class="load" id="load">جاري تحميل الملف…</div>
  </div>

  <a class="dl" id="dl" href="#" download>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/></svg>
    تحميل الملف
  </a>

  <div class="bar">
    <a class="back" id="backb" href="index.html">← رجوع</a>
    <a class="home" href="index.html">🏠 الرئيسية</a>
    <button class="mode" id="mode" type="button">🌙 الوضع الليلي</button>
  </div>
</div>

<button class="share" id="share" type="button" aria-label="مشاركة">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4l6 6-6 6"/><path d="M21 10H9a6 6 0 0 0-6 6v3"/></svg>
</button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function(){
  var $=function(i){return document.getElementById(i);};

  /* الوضع الليلي */
  var root=document.documentElement, modeBtn=$('mode');
  function paint(){modeBtn.textContent=root.getAttribute('data-theme')==='dark'?'☀️ الوضع النهاري':'🌙 الوضع الليلي';}
  paint();
  modeBtn.onclick=function(){
    var d=root.getAttribute('data-theme')==='dark';
    if(d){root.removeAttribute('data-theme');}else{root.setAttribute('data-theme','dark');}
    try{localStorage.setItem('mishkat_theme',d?'light':'dark');}catch(e){}
    paint();
  };

  /* رجوع */
  $('backb').onclick=function(e){
    e.preventDefault();
    if(history.length>1){history.back();}else{location.href='index.html';}
  };

  var toast=$('toast'), tm;
  function say(m){toast.textContent=m;toast.classList.add('on');clearTimeout(tm);tm=setTimeout(function(){toast.classList.remove('on');},2400);}

  /* بيانات الصفحة */
  var P=new URLSearchParams(location.search);
  var f=P.get('f')||'';
  var t=P.get('t')||'';
  var title=t||localStorage.getItem('mishkat_chapter')||'عرض الملف';
  $('ttl').textContent=title;
  document.title=title+' - أكاديمية مشكاة';

  /* مشاركة */
  $('share').onclick=function(){
    var data={title:'أكاديمية مشكاة',text:title,url:location.href};
    if(navigator.share){navigator.share(data).catch(function(){});}
    else if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(location.href).then(function(){say('تم نسخ رابط الملف ✓');});
    }else{say('انسخ الرابط من شريط العنوان');}
  };

  /* اسم الملف: أي اسم ينتهي بـ pdf ولا يحتوي على مسار */
  var okFile=/^[^\/\\?#:]+\.pdf$/i;

  var loadEl=$('load');
  function fail(msg){
    loadEl.hidden=false;
    loadEl.innerHTML='';
    var d=document.createElement('div');
    d.appendChild(document.createTextNode(msg||'تعذّر عرض الملف هنا.'));
    if(okFile.test(f)){
      d.appendChild(document.createElement('br'));
      var a=document.createElement('a');
      a.href=f;
      a.target='_blank';
      a.rel='noopener';
      a.textContent='فتح الملف مباشرة';
      d.appendChild(a);
    }
    loadEl.appendChild(d);
    $('pill').hidden=true;
  }

  if(!okFile.test(f)){fail('الملف غير موجود.');return;}
  $('dl').href=f;
  $('dl').setAttribute('download',f);

  if(!window.pdfjsLib){fail('تعذّر تحميل أداة العرض، تأكد من الاتصال بالإنترنت.');return;}
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  var pagesEl=$('pages'), pn=$('pn'), ents=[], io=null;
  var dpr=Math.min(window.devicePixelRatio||1,2.5);

  function freePage(e){
    e.tok++;
    if(e.task){try{e.task.cancel();}catch(x){}}
    e.task=null;
    e.canvas.width=0;
    e.canvas.height=0;
    e.done=false;
    e.busy=false;
  }

  function renderPage(e){
    if(e.done||e.busy) return;
    e.busy=true;
    var tok=++e.tok;
    var vp1=e.page.getViewport({scale:1});
    var target=Math.min(e.W*dpr*1.6,1800);
    var vp=e.page.getViewport({scale:target/vp1.width});
    var c=e.canvas;
    c.width=Math.floor(vp.width);
    c.height=Math.floor(vp.height);
    c.style.width=e.W+'px';
    c.style.height=Math.round(e.W*vp1.height/vp1.width)+'px';
    var task=e.page.render({canvasContext:c.getContext('2d'),viewport:vp});
    e.task=task;
    task.promise.then(function(){
      if(tok!==e.tok) return;
      e.done=true;
      e.busy=false;
    },function(){
      if(tok===e.tok) e.busy=false;
    });
  }

  function layout(){
    var W=Math.max(200,Math.floor(pagesEl.clientWidth-16));
    ents.forEach(function(e){
      e.W=W;
      e.el.style.width=W+'px';
      e.el.style.height=Math.round(W*e.h/e.w)+'px';
      freePage(e);
      if(io){io.unobserve(e.el);io.observe(e.el);}
    });
  }

  function currentPage(){
    var mid=pagesEl.scrollTop+pagesEl.clientHeight*0.4, k=1;
    for(var i=0;i<ents.length;i++){
      var el=ents[i].el;
      k=i+1;
      if(el.offsetTop+el.offsetHeight>mid) break;
    }
    return k;
  }

  var ticking=false;
  pagesEl.addEventListener('scroll',function(){
    if(ticking) return;
    ticking=true;
    requestAnimationFrame(function(){
      ticking=false;
      if(document.activeElement!==pn) pn.value=currentPage();
    });
  },{passive:true});

  function goTo(k){
    k=Math.max(1,Math.min(ents.length,parseInt(k,10)||1));
    pagesEl.scrollTop=ents[k-1].el.offsetTop-8;
    pn.value=k;
  }
  pn.addEventListener('change',function(){goTo(pn.value);});
  pn.addEventListener('keydown',function(ev){if(ev.key==='Enter'){goTo(pn.value);pn.blur();}});

  var rt;
  window.addEventListener('resize',function(){
    clearTimeout(rt);
    rt=setTimeout(function(){if(ents.length) layout();},250);
  });

  pdfjsLib.getDocument({url:f}).promise.then(function(pdf){
    var n=pdf.numPages, list=[];
    for(var i=1;i<=n;i++) list.push(pdf.getPage(i));
    return Promise.all(list);
  }).then(function(pgs){
    var frag=document.createDocumentFragment();
    pgs.forEach(function(p){
      var vp=p.getViewport({scale:1});
      var el=document.createElement('div');
      el.className='pg';
      var c=document.createElement('canvas');
      el.appendChild(c);
      var e={page:p,el:el,canvas:c,w:vp.width,h:vp.height,W:0,done:false,busy:false,tok:0,task:null};
      el.__ent=e;
      ents.push(e);
      frag.appendChild(el);
    });
    pagesEl.appendChild(frag);

    io=new IntersectionObserver(function(es){
      es.forEach(function(x){
        var e=x.target.__ent;
        if(x.isIntersecting){renderPage(e);}else{freePage(e);}
      });
    },{root:pagesEl,rootMargin:'900px 0px 900px 0px'});

    layout();
    requestAnimationFrame(layout);

    $('of').textContent='/ '+ents.length;
    pn.max=ents.length;
    $('pill').hidden=false;
    loadEl.hidden=true;
  }).catch(function(){
    fail('تعذّر عرض الملف هنا.');
  });
})();
</script>
</body>
</html>
